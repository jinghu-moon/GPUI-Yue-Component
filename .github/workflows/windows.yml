name: Windows
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/sync-yue-theme.mjs --check
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --features headless-tests
      - run: cargo test -p yue-component --locked --no-default-features --features headless-tests
      - run: python tools/test-virtualization-contracts.py
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo clippy --workspace --locked --all-targets --features headless-tests -- -D warnings
